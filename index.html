<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>The Movie List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Orbitron:wght@500&display=swap">
  <link rel="stylesheet" href="css/style.css?v=56">
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div id="loading-grid">
    <div class="lg-plane"></div>
  </div>
  <div id="loading-text">Loading your list</div>
</div>

<div id="app">

  <!-- Mobile sidebar overlay (inside #app so z-index competes with #sb-wrap in the same stacking context) -->
  <div id="sb-overlay"></div>

  <!-- HEADER -->
  <header id="hdr">
    <button id="menuBtn" aria-label="Open navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="h-rule"></div>

    <div id="logo-block">
      <div id="logo">The Movie List</div>
    </div>

    <div class="h-rule"></div>

    <div id="hud">
      <span id="hudClock"><span id="cTime">00:00</span><span id="cAmpm" class="c-ampm">AM</span></span>
    </div>
  </header>

  <!-- SIDEBAR -->
  <div id="sb-wrap">
    <nav id="sidebar">

      <div class="p-label">Library</div>
      <div class="nav-group">
        <div class="nav-item active" data-filter="all">
          <svg class="ico n-ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/></svg>
          All titles
        </div>
        <div class="nav-item" data-filter="queue">
          <svg class="ico n-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Queue
        </div>
        <div class="nav-item" data-filter="seen">
          <svg class="ico n-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
          Seen
        </div>
        <div class="nav-item" data-filter="favorites">
          <svg class="ico n-ico" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Favorites
        </div>
        <div class="nav-item" id="navLucky">
          <svg class="ico n-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h1.97a4 4 0 0 0 3.3-1.7l5.45-7.6a4 4 0 0 1 3.3-1.7H22M2 6h1.97a4 4 0 0 1 3.6 2.2M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"/></svg>
          Lucky draw
        </div>
      </div>

      <div class="p-label">Stats</div>
      <div class="stat-group">
        <div class="stat-row">
          <span class="sk">Total</span>
          <span class="sv" id="statTotal">0</span>
        </div>
        <div class="stat-row">
          <span class="sk">Seen</span>
          <span class="sv" id="statSeen">0</span>
        </div>
        <div class="stat-row">
          <span class="sk">Queue</span>
          <span class="sv" id="statQueue">0</span>
        </div>
        <div class="stat-row">
          <span class="sk">Favorites</span>
          <span class="sv amber" id="statFav">0</span>
        </div>
      </div>

      <div class="sb-foot">Synced from Google Sheets</div>
    </nav>
  </div>

  <!-- MAIN -->
  <div id="main-wrap">
    <main id="main">

      <!-- Toolbar -->
      <div id="toolbar">
        <div id="filter-scroll">
          <button class="fbtn active" data-filter="all">All</button>
          <button class="fbtn" data-filter="queue">Queue</button>
          <button class="fbtn" data-filter="seen">Seen</button>
          <button class="fbtn" data-filter="favorites">Favorites</button>
        </div>
        <button id="luckyBtn" aria-label="Lucky draw, pick a random movie" title="Pick a random movie">
          <svg id="lucky-btn-ico" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h1.97a4 4 0 0 0 3.3-1.7l5.45-7.6a4 4 0 0 1 3.3-1.7H22M2 6h1.97a4 4 0 0 1 3.6 2.2M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"/></svg>
          <span id="lucky-btn-lbl">Lucky draw</span>
        </button>
        <button id="refreshBtn" aria-label="Refresh from sheet" title="Refresh from sheet">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
      </div>

      <!-- Section heading -->
      <div id="section-hdr">
        <div id="section-rule"></div>
        <div id="section-title">All titles</div>
        <div id="section-count" aria-live="polite" aria-atomic="true"></div>
      </div>

      <div id="cardsWrap" role="list" aria-live="polite" aria-atomic="false"></div>
    </main>
  </div>

</div>

<!-- DETAIL MODAL -->
<div id="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title">
  <div id="detail-wrap">
    <div id="detail-modal">
      <button id="detailClose" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div id="detail-inner">
        <div id="detail-poster-col">
          <div id="detail-poster-box">
            <img id="detailImg" src="" alt="">
          </div>
          <div id="detail-poster-empty"></div>
        </div>
        <div id="detail-info-col">
          <div id="detail-title"></div>
          <div id="detail-sub-row">
            <span id="detail-year"></span>
            <span class="detail-dot">·</span>
            <span id="detail-runtime"></span>
            <span id="detail-imdb"></span>
          </div>
          <div id="detail-genre"></div>
          <div id="detail-director"></div>
          <div id="detail-fav" hidden>
            <svg class="ico ico-star" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Favorite
          </div>
          <div id="detail-divider"></div>
          <button id="plotToggleBtn" aria-expanded="false">
            Synopsis
            <svg class="ico ico-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div id="detail-plot" aria-hidden="true"></div>
          <div id="detail-action-row">
            <div id="detail-user-meta"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- LUCKY DRAW OVERLAY -->
<div id="lucky-overlay" role="dialog" aria-modal="true" aria-labelledby="lucky-title-txt">
  <div id="lucky-modal">
    <button id="luckyClose" aria-label="Close lucky draw">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="lucky-header">
      <div id="lucky-title-txt">Lucky draw</div>
      <div id="lucky-pool-label"></div>
    </div>
    <div id="lucky-arena"></div>
    <div id="lucky-result-panel" hidden>
      <div id="lucky-result-poster">
        <img id="luckyImg" src="" alt="">
        <div id="lucky-result-no-poster"></div>
      </div>
      <div id="lucky-result-info">
        <div id="lucky-result-title"></div>
        <div id="lucky-result-meta"></div>
        <div id="lucky-result-genre"></div>
        <button id="luckyViewBtn">View details</button>
      </div>
    </div>
    <div id="lucky-controls">
      <button id="luckyDealBtn" class="lucky-btn-primary">
        <svg id="lucky-deal-ico" class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h1.97a4 4 0 0 0 3.3-1.7l5.45-7.6a4 4 0 0 1 3.3-1.7H22M2 6h1.97a4 4 0 0 1 3.6 2.2M22 18h-6.04a4 4 0 0 1-3.3-1.8l-.36-.45"/></svg>
        Deal cards
      </button>
      <button id="luckyAgainBtn" class="lucky-btn-secondary" hidden>Deal again</button>
    </div>
  </div>
</div>

<script src="js/canvas.js?v=45"></script>
<script src="js/app.js?v=58"></script>
</body>
</html>
